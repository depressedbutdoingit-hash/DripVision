name: dripvision
description: "DripVision - Next-Gen AI Video Studio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  firebase_analytics: ^11.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  flutter_local_notifications: ^17.0.0
  share_plus: ^10.0.0
  gal: ^2.0.0
  ffmpeg_kit_flutter: ^6.0.0
  path_provider: ^2.1.2
  flutter_dotenv: ^5.1.0
  record: ^5.0.4
  purchases_flutter: ^8.0.0
  purchases_ui_flutter: ^8.0.0
  video_player: ^2.8.2
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  shorebird_code_push: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/dripvision_watermark.png
    - .env
